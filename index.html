<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>رفع ملفات الموبايل</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --muted:#94a3b8; --ok:#22c55e; --bad:#ef4444; --accent:#f59e0b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; font-size:22px; line-height:1.5; padding:16px; }
  h1 { font-size:30px; margin:8px 0 16px; text-align:center; }
  .card { background:var(--card); border-radius:20px; padding:16px; margin-bottom:16px; }
  input[type=password], input[type=text] { width:100%; font-size:26px; padding:18px; border-radius:14px; border:3px solid #475569; background:#0b1220; color:var(--text); }
  .btn { display:block; width:100%; min-height:96px; font-size:30px; font-weight:700; border:0; border-radius:20px; margin-top:12px; color:#0f172a; background:var(--accent); cursor:pointer; }
  .btn.green { background:var(--ok); }
  .btn.gray { background:#64748b; color:#fff; }
  .btn:disabled { opacity:.4; }
  .file { background:#0b1220; border-radius:14px; padding:12px; margin-top:10px; word-break:break-all; }
  .bar { height:18px; background:#334155; border-radius:9px; overflow:hidden; margin-top:8px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .2s; }
  .st-ok { color:var(--ok); } .st-bad { color:var(--bad); }
  #msg { text-align:center; min-height:34px; color:var(--muted); }
  .small { font-size:18px; color:var(--muted); }
</style>
</head>
<body>
<h1>رفع ملفات الموبايل</h1>

<div class="card">
  <label for="pw">الباسورد</label>
  <input id="pw" type="password" autocomplete="current-password">

  <input id="picker" type="file" webkitdirectory directory multiple hidden>
  <button class="btn" id="pick">اختار الذاكرة / الفولدر (دوسة واحدة)</button>

  <input id="pickerFiles" type="file" multiple hidden>
  <button class="btn gray" id="pickFiles">أو اختار ملفات لوحدها بدل الفولدر</button>

  <button class="btn green" id="go" disabled>ابدأ الرفع (يكمل لوحده)</button>
  <button class="btn gray" id="retry" hidden>جرّب الفاشل تاني</button>
  <p id="msg"></p>
  <p class="small">سيب الصفحة مفتوحة والشاشة شغالة لحد ما كله يخلص. لو قفلت الصفحة بالغلط، افتحها تاني واختار نفس الفولدر وهتكمل من غير ما تكرر اللي اترفع.</p>
</div>

<div class="card" id="summary" hidden>
  <div id="summaryText"></div>
  <div class="bar" style="height:26px;"><div id="overallBar"></div></div>
  <div id="currentFile" class="small"></div>
</div>

<div id="list"></div>

<script>
// ====== الإعدادات: حط رابط الـ Web App بتاع Apps Script هنا ======
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyRl4ibw2ThlogLN0HhFtdeQDkMo8SvQYOQEDNuNVlAsEPGW9OOIP_ehDh0_l-qbZW7Kw/exec';
// حجم الجزء: لازم يكون مضاعف 256KB (3MB = 12 × 256KB)
const CHUNK = 12 * 256 * 1024;
const RETRIES = 4;
// ================================================================

const $ = (id) => document.getElementById(id);
let items = [];   // {file, key, state}
let running = false;
let wakeLock = null;
let autoStart = false;

// تتبع اللي اترفع قبل كده، عشان لو الصفحة اتقفلت وفتحناها تاني نتخطاهم
function doneSet() {
  try { return new Set(JSON.parse(localStorage.getItem('pr_done') || '[]')); } catch (e) { return new Set(); }
}
function markDone(key) {
  try {
    const s = doneSet(); s.add(key);
    localStorage.setItem('pr_done', JSON.stringify(Array.from(s)));
  } catch (e) {}
}
function fileKey(file) {
  return (file.webkitRelativePath || file.name) + '|' + file.size + '|' + file.lastModified;
}

try { $('pw').value = localStorage.getItem('pr_pw') || ''; } catch (e) {}

$('pick').onclick = () => $('picker').click();
$('pickFiles').onclick = () => $('pickerFiles').click();
$('picker').onchange = () => loadFiles($('picker').files, true);
$('pickerFiles').onchange = () => loadFiles($('pickerFiles').files, false);

function loadFiles(fileList, isFolder) {
  const all = Array.from(fileList);
  const already = doneSet();
  items = all.map((file) => ({ file, key: fileKey(file), state: already.has(fileKey(file)) ? 'done' : 'wait' }));
  $('list').innerHTML = '';

  const todo = items.filter((i) => i.state === 'wait');
  const skip = items.length - todo.length;
  let totalBytes = 0, img = 0, vid = 0, other = 0;
  todo.forEach((i) => {
    totalBytes += i.file.size;
    const t = (i.file.type || '');
    if (t.startsWith('image/')) img++; else if (t.startsWith('video/')) vid++; else other++;
  });

  $('summary').hidden = items.length === 0;
  $('summaryText').textContent =
    (isFolder ? 'لقيت في الفولدر: ' : 'اخترت: ') + items.length + ' ملف' +
    (skip ? ' (تخطينا ' + skip + ' اترفعوا قبل كده) ' : ' ') +
    '— ' + fmt(totalBytes) + ' المتبقي (صور ' + img + '، فيديو ' + vid + '، غيره ' + other + ')';
  $('overallBar').style.width = '0%';
  $('currentFile').textContent = '';

  $('go').disabled = todo.length === 0;
  $('retry').hidden = true;
  $('msg').textContent = todo.length ? 'جاهز. دوس "ابدأ الرفع" مرة واحدة وسيبها تكمل.' : (items.length ? 'كل الملفات دي اترفعت قبل كده.' : '');
}

$('go').onclick = () => run(['wait']);
$('retry').onclick = () => run(['failed']);

function fmt(n) {
  if (n > 1073741824) return (n / 1073741824).toFixed(2) + ' GB';
  if (n > 1048576) return (n / 1048576).toFixed(1) + ' MB';
  return Math.ceil(n / 1024) + ' KB';
}

async function api(body) {
  // بدون headers عشان يفضل طلب بسيط ومايحصلش مشكلة CORS
  const res = await fetch(APPS_SCRIPT_URL, { method: 'POST', body: JSON.stringify(body) });
  return res.json();
}

function toBase64(blob) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(String(r.result).split(',')[1] || '');
    r.onerror = () => reject(r.error);
    r.readAsDataURL(blob);
  });
}

async function withRetry(fn) {
  let last;
  for (let i = 0; i < RETRIES; i++) {
    try {
      const r = await fn();
      if (r && r.ok) return r;
      if (r && r.error === 'bad_password') throw new Error('bad_password');
      last = new Error((r && r.error) || 'فشل');
    } catch (e) {
      if (e.message === 'bad_password') throw e;
      last = e;
    }
    await new Promise((r) => setTimeout(r, 1500 * (i + 1)));
  }
  throw last;
}

async function uploadOne(it, pw, onChunk) {
  const f = it.file;
  const name = f.webkitRelativePath || f.name;
  const s = await withRetry(() => api({ action: 'start', pw, name, size: f.size, mime: f.type }));
  let offset = 0;
  while (offset < f.size) {
    const end = Math.min(offset + CHUNK, f.size);
    const data = await toBase64(f.slice(offset, end));
    await withRetry(() => api({ action: 'chunk', pw, session: s.session, start: offset, total: f.size, data }));
    onChunk(end - offset);
    offset = end;
  }
}

async function run(states) {
  if (running) return;
  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('PUT_YOUR') === 0) {
    $('msg').textContent = 'لسه ما حطيتش رابط الـ Web App جوه index.html';
    return;
  }
  const pw = $('pw').value;
  if (!pw) { $('msg').textContent = 'اكتب الباسورد الأول'; return; }
  try { localStorage.setItem('pr_pw', pw); } catch (e) {}

  running = true;
  $('go').disabled = true; $('retry').hidden = true;
  try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  window.onbeforeunload = () => 'الرفع شغال';

  $('msg').textContent = 'بتأكد من الباسورد...';
  try {
    await withRetry(() => api({ action: 'ping', pw }));
  } catch (e) {
    $('msg').textContent = e.message === 'bad_password' ? 'الباسورد غلط' : 'مش قادر أوصل للسيرفر: ' + e.message;
    finish(); return;
  }

  const queue = items.filter((i) => states.includes(i.state));
  const totalBytes = queue.reduce((sum, i) => sum + i.file.size, 0) || 1;
  let sentBytes = 0, done = 0, failed = 0, failedNames = [];

  for (const it of queue) {
    $('currentFile').textContent = 'بيرفع (' + (done + failed + 1) + '/' + queue.length + '): ' + (it.file.webkitRelativePath || it.file.name) + ' — ' + fmt(it.file.size);
    try {
      await uploadOne(it, pw, (chunkBytes) => {
        sentBytes += chunkBytes;
        $('overallBar').style.width = Math.min(100, Math.round((sentBytes / totalBytes) * 100)) + '%';
      });
      it.state = 'done';
      markDone(it.key);
      done++;
    } catch (e) {
      it.state = 'failed';
      failed++; failedNames.push(it.file.name);
      if (e.message === 'bad_password') break;
    }
  }

  $('currentFile').textContent = '';
  $('msg').textContent = 'خلص. نجح ' + done + (failed ? (' وفشل ' + failed + ': ' + failedNames.slice(0, 5).join('، ')) : '');
  $('retry').hidden = !items.some((i) => i.state === 'failed');
  finish();
}

function finish() {
  running = false;
  window.onbeforeunload = null;
  try { if (wakeLock) wakeLock.release(); } catch (e) {}
  $('go').disabled = !items.some((i) => i.state === 'wait');
}
</script>
</body>
</html>
